name: secrets

# Scans the whole history for secrets on every pull request and push to main, and once a week.
# It runs the gitleaks binary (MIT) at a fixed version and checks its checksum, instead of the
# gitleaks action, which asks organizations for a license key.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "41 4 * * 1"

permissions:
  contents: read

env:
  GITLEAKS_VERSION: 8.30.1
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          file="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o "$file" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$file"
          echo "${GITLEAKS_SHA256}  $file" | sha256sum --check
          tar -xzf "$file" gitleaks
      # The config extends the default rules and lists the few files with look-alike values.
      - run: ./gitleaks detect --source . --config .gitleaks.toml --redact --no-banner
