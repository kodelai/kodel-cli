name: agents-nightly

# The scenarios with real coding agents are not part of the normal CI: they spend tokens and vary
# from run to run. This runs them each night, several times on each model, and keeps the rates.
# With an API key they cost money (a cap per turn is set); without the secret the job does nothing.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      models:
        description: "Models, comma separated (aliases or full names)"
        default: "sonnet"
      repeat:
        description: "How many times each model runs the whole set"
        default: "3"

jobs:
  agents:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - id: key
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "No ANTHROPIC_API_KEY secret: nothing to run."
            echo "have=false" >> "$GITHUB_OUTPUT"
          else
            echo "have=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.key.outputs.have == 'true'
        uses: actions/checkout@v4
      - if: steps.key.outputs.have == 'true'
        uses: oven-sh/setup-bun@v2
      - if: steps.key.outputs.have == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - if: steps.key.outputs.have == 'true'
        run: bun install --frozen-lockfile
      - if: steps.key.outputs.have == 'true'
        run: npm install -g @anthropic-ai/claude-code
      - if: steps.key.outputs.have == 'true'
        run: git config --global user.email "ci@example.com" && git config --global user.name "CI"
      - if: steps.key.outputs.have == 'true'
        # A scenario that does not always pass is a finding, not a failure of the job: the rates
        # are in the log and in the uploaded results.
        run: >
          bun run test:agents:stats --
          --models "${{ github.event.inputs.models || 'sonnet' }}"
          --repeat "${{ github.event.inputs.repeat || '3' }}"
          --min-rate 0
      - if: steps.key.outputs.have == 'true' && always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-stats
          path: tests/agents/.stats/
