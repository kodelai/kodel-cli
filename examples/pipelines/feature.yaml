# Reference pipeline `feature` (draft syntax, not yet implemented).
# Example for THIS repository (TypeScript, Bun); the commands are project-specific and would be
# produced per project by the `design` skill. Full model: the MCP contract, section 3.
#
# Model:
#   * A node has a `kind` that says what it does:
#       agent   - the coding agent works (needs `prompt`)
#       command - the engine runs `command`
#       human   - waits for a human decision, outcome `approved` or `rejected`
#   * `checks` verify the result of the node. They run in order and stop at the first failure.
#     Check kinds: diff, command, result. Each may set `on_fail` (an edge label, default `failed`).
#     `diff` takes `paths` and a `mode` (changed | changed_only | only | unchanged).
#   * Edges are taken when `when` equals the node's outcome label (default `passed`).
#     A failed agent node with no matching edge is re-entered with the failure reason.
#   * When a node is re-entered, the engine adds the reason (command output tail, blocking
#     findings, the human's rejection reason) to the next_step prompt.

format: 1
name: feature
description: Plan, implement, verify and document a feature, with two human gates.

defaults:
  timeout: 900                  # seconds, per node attempt
  max_consecutive_failures: 3   # automatic failures of a node in a row; then the run pauses
  max_attempts: 10              # all attempts of a node in one run (human rejections included)

nodes:
  - slug: plan
    kind: agent
    prompt: |
      Task: {{task}}
      Explore the repository and write an implementation plan to
      docs/plans/{{task.slug}}.md: goal, affected files, steps, test strategy, risks.
      Do not change any other file.
    checks:
      - kind: diff
        paths: ["docs/plans/{{task.slug}}.md"]
        mode: changed_only      # the plan file changed and nothing else did
        min_lines: 10

  - slug: plan-approval
    kind: human
    prompt: "Review the plan. Approve to start implementation, or reject with a reason."
    files: ["docs/plans/{{task.slug}}.md"]

  - slug: impl
    kind: agent
    prompt: |
      Implement the approved plan in docs/plans/{{task.slug}}.md.
      Keep changes within the plan. Add or update tests for the changed behavior.
    checks:
      # `since` defaults to `node`: after a rejection at manual-test only the new iteration counts
      - { kind: diff, paths: ["packages/**", "tests/**"], max_lines: 800 }
      - { kind: diff, paths: [".kodel/runs/**", "docs/**"], mode: unchanged }

  - slug: build
    kind: command
    command: "bun run build"
    timeout: 600

  - slug: test
    kind: command
    command: "bun test"
    timeout: 900

  - slug: review
    kind: agent
    prompt: |
      Review the changes against the plan in docs/plans/{{task.slug}}.md.
      Report every problem as a finding.
    checks:
      - kind: result
        columns:
          severity:    { enum: [blocker, critical, major, minor, info] }
          location:    location
          description: text
        fail_when: { severity: [blocker, critical, major] }   # any matching row fails the check
        on_fail: blocking_findings

  - slug: e2e
    kind: command
    command: "bun test tests/e2e"
    timeout: 900

  - slug: manual-test
    kind: human
    prompt: |
      Try the feature by hand as a user would. Approve if it behaves as planned,
      or reject with what is wrong.

  - slug: docs
    kind: agent
    prompt: |
      Update the documentation (README and docs/) for the new behavior.
      Write in English.
    checks:
      - { kind: diff, paths: ["docs/**", "README.md"], mode: changed_only }

edges:
  - { from: plan,          to: plan-approval }
  - { from: plan-approval, to: impl,         when: approved }
  - { from: plan-approval, to: plan,         when: rejected }
  - { from: impl,          to: build }
  - { from: build,         to: test }
  - { from: build,         to: impl,         when: failed }
  - { from: test,          to: review }
  - { from: test,          to: impl,         when: failed }
  - { from: review,        to: e2e }
  - { from: review,        to: impl,         when: blocking_findings }
  - { from: e2e,           to: manual-test }
  - { from: e2e,           to: impl,         when: failed }
  - { from: manual-test,   to: docs,         when: approved }
  - { from: manual-test,   to: impl,         when: rejected }
