version: 1
tasks:
  enabled: true
decisions:
  agent:
    gate: true
    pipeline_change: true
serve:
  enabled: true
  max_workers: 2
  max_runs: 3
  # Nothing starts on its own: tasks are started by hand. The daemon still resumes
  # agents after a decision, notes dead ones and finishes sessions of ended runs.
  start: []
