# The pipeline we use on this repository itself (dogfooding). Syntax: examples/pipelines/feature.yaml.
format: 1
name: dev
description: Plan, implement and verify a change to Kodel, with a human gate on the plan and on the result.

defaults:
  timeout: 900
  max_consecutive_failures: 3
  max_attempts: 10

nodes:
  - slug: plan
    kind: agent
    prompt: |
      Task: {{task}}
      Read AGENTS.md first. Explore the repository and write an implementation plan to
      docs/plans/{{task.slug}}.md: goal, affected files, steps, test strategy, risks.
      Do not change any other file.
    checks:
      - kind: diff
        paths: ["docs/plans/{{task.slug}}.md"]
        mode: changed_only
        min_lines: 10

  - slug: plan-approval
    kind: human
    prompt: "Review the plan. Approve to start implementation, or reject with a reason."
    files: ["docs/plans/{{task.slug}}.md"]

  - slug: impl
    kind: agent
    prompt: |
      Implement the approved plan in docs/plans/{{task.slug}}.md.
      Keep changes within the plan. Add or update tests for the changed behavior.
      Follow the conventions in AGENTS.md (English only, no `any`, Biome style).
    checks:
      - { kind: diff, paths: ["packages/**", "scripts/**", "examples/**", "skills/**", "adapters/**"], max_lines: 800 }
      - { kind: diff, paths: [".kodel/runs/**"], mode: unchanged }

  - slug: verify
    kind: command
    command: "bun run typecheck && bun run lint"
    timeout: 300

  - slug: test
    kind: command
    command: "bun test"
    timeout: 900

  - slug: build
    kind: command
    command: "bun run build && bun run check:artifact"
    timeout: 300

  - slug: review
    kind: agent
    prompt: |
      Review the changes against the plan in docs/plans/{{task.slug}}.md and against AGENTS.md.
      Report every problem as a finding.
    checks:
      - kind: result
        columns:
          severity:    { enum: [blocker, critical, major, minor, info] }
          location:    location
          description: text
        fail_when: { severity: [blocker, critical, major] }
        on_fail: blocking_findings

  - slug: final-approval
    kind: human
    prompt: |
      Look at the diff and try the change. Approve to finish, or reject with what is wrong.

edges:
  - { from: plan,           to: plan-approval }
  - { from: plan-approval,  to: impl,         when: approved }
  - { from: plan-approval,  to: plan,         when: rejected }
  - { from: impl,           to: verify }
  - { from: verify,         to: test }
  - { from: verify,         to: impl,         when: failed }
  - { from: test,           to: build }
  - { from: test,           to: impl,         when: failed }
  - { from: build,          to: review }
  - { from: build,          to: impl,         when: failed }
  - { from: review,         to: final-approval }
  - { from: review,         to: impl,         when: blocking_findings }
  - { from: final-approval, to: impl,         when: rejected }
