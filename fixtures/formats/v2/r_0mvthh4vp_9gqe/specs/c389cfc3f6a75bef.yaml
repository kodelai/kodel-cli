# A fork: two command steps run at the same time and meet at a join that sees which of them failed.
# The join is an agent step; its reserved outcome `restart_failed` runs only the failed branches again.
# The commands are valid in a POSIX shell and in cmd.exe alike (`node -e`); replace them with the
# project's own. See `pipeline_docs` (pipeline-spec, "Forks") for the rules.
version: 1
name: fork
description: Make a change, then verify and test it at the same time; fix what failed.
nodes:
  - slug: impl
    kind: agent
    prompt: |
      Task: {{task}}
      Make the change. Add or update tests for the changed behavior.
  - slug: verify
    kind: command
    command: node -e "setTimeout(() => {}, 1500)"
    timeout: 600
  - slug: test
    kind: command
    command: node -e "const fs=require('fs');if(!fs.existsSync('.test-ran')){fs.writeFileSync('.test-ran','');console.log('1 test failed');process.exit(1)}console.log('all tests passed')"
    timeout: 900
  - slug: fix
    kind: agent
    join: all
    prompt: |
      Verify and test ran at the same time on your change. If a branch failed, the feedback names it
      and says why: fix the cause, then finish with the outcome restart_failed so that only the failed
      steps run again. If both passed, finish normally.
edges:
  - { from: impl, to: verify }
  - { from: impl, to: test }
  - { from: verify, to: fix }
  - { from: verify, to: fix, when: failed }
  - { from: test, to: fix }
  - { from: test, to: fix, when: failed }
